<!doctype html>
<html lang="en" class="bg-black">
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23fff'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-black text-white antialiased">
    <!-- Painted from the very first frame so the prerendered hero never flashes
         before the JS decides whether to play the opening sequence. Removed by
         the root layout once hydration is done (or the intro overlay is up). -->
    <div
      id="boot-cover"
      style="position:fixed;inset:0;background:#000;z-index:100;transition:opacity .3s ease"
    ></div>
    <noscript><style>#boot-cover{display:none}</style></noscript>
    <script>
      setTimeout(function () {
        var e = document.getElementById('boot-cover');
        if (e) e.remove();
      }, 5000);
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
