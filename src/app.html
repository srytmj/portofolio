<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Stamp the theme onto <html> before the first paint. Everything that is
      // theme-aware (CSS variables, Tailwind's dark: variant, the boot cover)
      // keys off these attributes, so setting them here is what prevents a
      // wrong-colour flash between first paint and hydration.
      try {
        var light = localStorage.getItem('yorha-theme') === 'light';
        var root = document.documentElement;
        root.setAttribute('data-theme', light ? 'light' : 'dark');
        root.setAttribute('data-blog-theme', light ? 'sepia' : 'dark');
        if (light) {
          var f = document.querySelector("link[rel*='icon']");
          if (f) f.href = '/favicon-light.svg';
          var m = document.querySelector("meta[name='theme-color']");
          if (m) m.content = '#D1D2C5';
        }
      } catch (e) {}
    </script>
    <style>
      /* The cover has to match the theme it is hiding, or the "no flash"
         cover is itself the flash. */
      #boot-cover {
        background: #000;
      }
      :root[data-theme='light'] #boot-cover {
        background: #d1d2c5;
      }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="antialiased">
    <!-- Painted from the very first frame so the prerendered hero never flashes
         before the JS decides whether to play the opening sequence. Removed by
         the root layout once hydration is done (or the intro overlay is up). -->
    <div
      id="boot-cover"
      style="position:fixed;inset:0;background:#000;z-index:100;transition:opacity .3s ease"
    ></div>
    <noscript><style>#boot-cover{display:none}</style></noscript>
    <script>
      setTimeout(function () {
        var e = document.getElementById('boot-cover');
        if (e) e.remove();
      }, 5000);
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
