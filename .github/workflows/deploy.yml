name: Deploy Portfolio to GitHub Pages

# The build is a static folder (see svelte.config.js), so this workflow only
# builds and uploads it. Switching hosts later means deleting this file, not
# changing the build: nginx on EC2 and the homelab container serve the same
# `build/` output.
#
# One manual step is required once, in the repository settings:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# For the apex domain, also add a `static/CNAME` file containing the hostname.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, but let a queued one finish rather than
# cancelling a release that is already half applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
