server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # SvelteKit's static adapter emits list routes as a flat "blog.html" /
    # "projects.html" alongside a same-named directory holding only the
    # child-slug pages (no index.html inside). A trailing-slash request like
    # /blog/ needs "blog.html", not "/blog/.html" (which is what $uri.html
    # literally becomes when $uri already ends in "/" — string concatenation,
    # not path normalization). This regex location strips the trailing slash
    # before appending .html so it resolves to the right file.
    location ~ ^(?<base>.+)/$ {
        try_files $base.html $uri $uri/ /404.html;
    }

    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
