server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        # $uri.html before $uri/: SvelteKit's static adapter emits list routes as
        # a flat "blog.html" / "projects.html" alongside a same-named directory
        # that holds only the child-slug pages (no index.html inside). If $uri/
        # is tried first, nginx matches the directory, finds no index file
        # (autoindex is off), and returns 403 instead of ever trying $uri.html.
        try_files $uri $uri.html $uri/ /404.html;
    }

    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
